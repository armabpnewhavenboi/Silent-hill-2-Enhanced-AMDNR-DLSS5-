; SH2NR - AMD neural rendering (DLSS 5 NR, lmxxf runtime via AMDNR) for 32-bit / old games.
; Changes here are picked up while the game runs (save the file; no restart needed).

[SH2NR]
; 1 = on at start. The toggle key switches it on/off in game (compare with and without).
Enabled=1
; Virtual-key codes: 120 = F9, 121 = F10 (see learn.microsoft.com "virtual-key codes").
ToggleKey=120
; Split view: left half original, right half neural rendering.
SplitKey=121
SplitView=0

; How much of the network's change to keep (0..1). Lower these if faces or textures look "AI".
DetailStrength=1.0
ColorStrength=0.85
; Final blend with the original picture (0 = original, 1 = full effect).
Mix=1.0

; Resolution the network runs at. 0 = as high as it goes (1080 lines); 900 or 720 = faster, softer.
; Your game runs at 1440p: the network's change is scaled up onto the full-resolution picture either way.
NetworkHeight=0

; Upscaler for the network's answer.
;   native = the game's full-resolution frame + the network's change scaled up (sharpest native detail)
;   fsr4   = the network runs at the FSR render size and AMD FSR 4 rebuilds the full frame (faster network, FSR 4 look)
;   fsr3   = the same with FSR 3.1;  fsr = the newest your card offers
Upscaler=fsr4
; native (1.0x, FSR 4 as anti-aliasing), quality (1.5x), balanced (1.7x), performance (2x), ultraperformance (3x)
FsrQuality=native
; FSR's sharpening, 0..1 (0 = off)
FsrSharpness=0.25
; How much FSR trusts the current frame over its history, 0..1. Higher = less ghosting/smearing, but more shimmer.
; This game gives FSR no depth, so FSR cannot see on its own where something moved - start around 0.5.
FsrReactive=0.7

; Network passes per frame (1..3). Each pass costs a full network run; 1 is recommended.
Passes=1
; 1 = all 71 network blocks (slightly slower, slightly closer to the reference). 0 = lmxxf's production schedule.
FullNetwork=1

; How much detail the network adds, per kind of surface (0..4, 1 = the network as shipped).
; Characters = faces, skin, hair, clothes. Scene = walls, floors, props. Higher = more "remastered" detail,
; too high = blotchy / painted patches. Changing these restarts the network's history (one blink).
CharacterStructure=1.8
SceneStructure=1.4

; Motion vectors from ReShade's iMMERSE Launchpad give the network temporal history (less flicker).
; Launchpad must be installed and switched ON in the ReShade menu (and above nothing that changes the picture before it).
UseMotionVectors=1
MotionEffect=MartysMods_LAUNCHPAD.fx
MotionTexture=MotionVectorsTex
; Launchpad stores UV offsets to the previous frame; these scale them to pixels. Use -1 to flip a wrong direction.
MotionScaleX=1.0
MotionScaleY=1.0
; Temporal smoothing of the network's answer (0..0.8). Only with motion vectors.
TemporalSmoothing=0.3

; How long a frame may wait for the network before it is shown without it (ms).
FrameTimeoutMs=120
; 1 = the add-on starts sh2nr_feeder.exe itself.
LaunchFeeder=1
